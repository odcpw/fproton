[workspace]
resolver = "2"
members = ["crates/fproton-core", "crates/fproton"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/odcpw/fproton"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
toml = "1.1"
libc = "0.2"
ftui = { version = "0.7", features = ["crossterm"] }
ftui-extras = { version = "0.7", features = ["canvas"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
